name: CI

# External actions are pinned to full commit SHAs to prevent supply-chain
# attacks via tag reassignment. Run `gh api repos/OWNER/REPO/git/refs/tags/vN`
# to look up the current SHA when upgrading. Review SonarCloud hotspots
# (rule githubactions:S7637) periodically.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    types: [opened, synchronize, reopened]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Primary test + coverage gate on PHP 8.4 (the production target).
    # Single Pest invocation: parallel runner + pcov + clover output.
    # SonarQube depends on this job for the coverage report.
    name: Pest + coverage (PHP 8.4)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      # pcov is ~3-5x faster than xdebug for coverage. The trade-off is
      # that branch/path coverage is not reported (statement + line only),
      # which is fine for spora-core's quality gate (clover XML is consumed
      # by SonarCloud which only needs line coverage).
      - name: Setup PHP with pcov
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.4'
          extensions: pdo_mysql, zip
          coverage: pcov
          tools: composer

      - name: Composer install
        run: composer install --no-interaction --prefer-dist

      - name: Run Pest (parallel, with coverage)
        run: ./vendor/bin/pest --parallel --processes=auto --max-batch-size=50 --coverage-clover=coverage.xml --fail-on-risky

      - name: Upload coverage.xml
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-report
          path: coverage.xml
          if-no-files-found: error
          retention-days: 7

  test-85:
    # PHP 8.5 compatibility check: same suite, no coverage. Runs in
    # parallel with the 8.4 test+coverage job. If the suite passes on
    # 8.4 but fails on 8.5, the PR is blocked.
    name: Pest (PHP 8.5)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.5'
          extensions: pdo_mysql, zip
          coverage: none
          tools: composer

      - name: Composer install
        run: composer install --no-interaction --prefer-dist

      - name: Run Pest (parallel)
        run: ./vendor/bin/pest --parallel --processes=auto --max-batch-size=50 --fail-on-risky

  test-mysql:
    # MySQL 8.0 compatibility gate: the suite runs against a real MySQL
    # server (per-worker databases on a tmpfs-backed container). No coverage
    # here — SonarCloud consumes the clover XML from the SQLite `test` job.
    # Two explicit jobs (mysql + mariadb) instead of a matrix because the
    # migration suite has `=== 'mariadb'` branches that only run when the
    # connection class reports the MariaDB driver; a matrix would hide
    # engine-specific failures behind a single status check.
    name: Pest (PHP 8.4, MySQL 8.0)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: spora_root
        ports: ['3306:3306']
        options: >-
          --tmpfs /var/lib/mysql:rw,noexec,nosuid,size=1024m
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      SPORA_TEST_DB_DRIVER:   mysql
      SPORA_TEST_DB_HOST:     127.0.0.1
      SPORA_TEST_DB_PORT:     3306
      SPORA_TEST_DB_USER:     root
      SPORA_TEST_DB_PASSWORD: root
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.4'
          extensions: pdo_mysql, zip
          coverage: none
          tools: composer

      - name: Composer install
        run: composer install --no-interaction --prefer-dist

      - name: Wait for MySQL
        run: |
          for i in {1..30}; do
            mysqladmin ping -h 127.0.0.1 -uroot -proot --silent && exit 0
            sleep 2
          done
          echo "MySQL did not become ready in time" >&2
          exit 1

      - name: Run Pest (parallel, MySQL)
        run: ./vendor/bin/pest --parallel --processes=auto --max-batch-size=50 --fail-on-risky

  test-mariadb:
    # MariaDB 11 compatibility gate. Mirrors `test-mysql`; the separate
    # driver flag (`SPORA_TEST_DB_DRIVER=mariadb`) is what makes the
    # migration suite's `=== 'mariadb'` branches reachable instead of
    # dead code.
    name: Pest (PHP 8.4, MariaDB 11)
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: spora_root
        ports: ['3306:3306']
        options: >-
          --tmpfs /var/lib/mysql:rw,noexec,nosuid,size=1024m
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      SPORA_TEST_DB_DRIVER:   mariadb
      SPORA_TEST_DB_HOST:     127.0.0.1
      SPORA_TEST_DB_PORT:     3306
      SPORA_TEST_DB_USER:     root
      SPORA_TEST_DB_PASSWORD: root
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.4'
          extensions: pdo_mysql, zip
          coverage: none
          tools: composer

      - name: Composer install
        run: composer install --no-interaction --prefer-dist

      - name: Wait for MariaDB
        run: |
          for i in {1..30}; do
            mariadb-admin ping -h 127.0.0.1 -uroot -proot --silent && exit 0
            sleep 2
          done
          echo "MariaDB did not become ready in time" >&2
          exit 1

      - name: Run Pest (parallel, MariaDB)
        run: ./vendor/bin/pest --parallel --processes=auto --max-batch-size=50 --fail-on-risky

  static-analysis:
    name: PHPStan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.4'
          extensions: pdo_mysql, zip
          coverage: none
          tools: composer

      - name: Composer install
        run: composer install --no-interaction --prefer-dist

      - name: Run PHPStan
        run: ./vendor/bin/phpstan analyse --no-progress --memory-limit=2G

      # Generated OpenAPI drift + conflict-marker guard. Regenerating the
      # spec inside CI keeps the committed openapi.json honest — when a
      # PR adds an endpoint via attributes, `composer openapi` should be
      # rerun and the result committed; the check below fails if a PR
      # touches the file without regenerating it, and also blocks merge
      # conflict markers (`<<<<<<<`) sneaking into the JSON blob.
      - name: Check OpenAPI drift
        if: github.event_name == 'pull_request'
        run: composer openapi:check

      # `git diff --check` inspects the working tree for unresolved
      # conflict markers. We restrict to tracked files so the hook never
      # fails on a deleted-staged entry or an untracked comment; an empty
      # match is the success path.
      - name: Check for merge-conflict markers
        if: github.event_name == 'pull_request'
        run: |
          if ! git diff --check $(git diff --name-only --diff-filter=ACMRT HEAD~ HEAD); then
            echo "Unresolved merge-conflict markers detected in the changeset."
            exit 1
          fi

  sonar:
    name: SonarCloud scan
    needs: test
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Download coverage.xml
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: coverage-report
          path: .

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@fd88b7d7ccbaefd23d8f36f73b59db7a3d246602 # v6.0.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
