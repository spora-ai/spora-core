name: password_reset
subject: "Reset your password — {{site_name}}"
body: |
  Hi,

  we received a request to reset the password for **{{email}}**. If this was
  you, follow the link below to choose a new password. The link expires in
  **1 hour** and can be used once.

  [Reset your password]({{reset_link}})

  If you didn't request a password reset, you can safely ignore this email —
  your account is unchanged.

  — The {{site_name}} team
