name: email_change_verification
subject: "Confirm your new email address — {{site_name}}"
body: |
  A request was made to change the email address on your {{site_name}}
  account to **{{email}}**.

  Please confirm by clicking the link below. The old address will keep
  working if you ignore this email.

  [Confirm the new address]({{verification_link}})

  If you didn't make this request, no further action is needed.

  — The {{site_name}} team
